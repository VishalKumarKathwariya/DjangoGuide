{% extends 'base.html' %}
{% block content %}

<h2>Admission Form</h2>

<form method="POST" enctype="multipart/form-data" class="card p-4">

{% csrf_token %}

{% for field in form %}
{% include 'admission/partials/form_field.html' with field=field %}
{% endfor %}

<button class="btn btn-primary">Save</button>

</form>

{% endblock %}
